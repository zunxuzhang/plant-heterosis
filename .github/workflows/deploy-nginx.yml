name: Deploy Static Site to Nginx Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload site files
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_TARGET: ${{ secrets.SERVER_TARGET }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${SERVER_PORT:-22}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='plant-heterosis-site.zip' \
            ./ "${SERVER_USER}@${SERVER_HOST}:${SERVER_TARGET}/"

      - name: Reload Nginx
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "sudo nginx -t && sudo systemctl reload nginx"
